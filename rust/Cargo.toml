[package]
name = "opus-jni-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
eyre = "0.6.12"
jni = "0.22.4"
opus = { git = "https://github.com/SpaceManiac/opus-rs", rev = "559876660603dc8079a053e03e6438766f669e69" }

[lib]
crate-type = ["cdylib"]

# https://github.com/johnthagen/min-sized-rust
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
